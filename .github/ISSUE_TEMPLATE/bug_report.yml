name: Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: A release tag or commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, language/runtime version, and how you installed it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or inputs that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials, personal data and confidential information from this report.
          required: true
