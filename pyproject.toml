[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verdigraph-neurogenesis"
version = "0.1.0"
description = "A software framework for self-evolving AI-agent cognitive graphs."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Verdigraph Contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
mcp = ["mcp[cli]>=1.0", "pydantic>=2.0"]

[project.scripts]
verdigraph-mcp = "verdigraph_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verdigraph*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
